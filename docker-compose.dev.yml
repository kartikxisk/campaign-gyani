# Backing services for local development only — the api and web run on the
# host via `pnpm dev`. Ports and credentials match apps/api/.env and .env.test.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Not for production: fixed dev credentials, no Redis password.
name: campaign-gyani-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cg
      POSTGRES_PASSWORD: cg
      POSTGRES_DB: campaign_gyani
    volumes:
      - cg_dev_pg:/var/lib/postgresql/data
      # Creates campaign_gyani_test for the api test suite (first boot only).
      - ./docker/dev/postgres-init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5490:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cg -d campaign_gyani"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes: [cg_dev_redis:/data]
    ports: ["127.0.0.1:6490:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches all outgoing mail (MailHog successor). Point a sending profile at
  # host localhost, port 1025, no TLS, no auth; read mail at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 5000
    volumes: [cg_dev_mail:/data]
    command: ["--database", "/data/mailpit.db"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  cg_dev_pg:
  cg_dev_redis:
  cg_dev_mail:
