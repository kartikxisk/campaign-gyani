services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-campaign_gyani}
    volumes: [cg_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cg}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published to the host; only reachable on the internal compose network.

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes: [cg_redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cg}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-campaign_gyani}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      API_PORT: 8080
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      SMTP_ENC_KEY: ${SMTP_ENC_KEY:?set SMTP_ENC_KEY (32 chars)}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?set ADMIN_INITIAL_PASSWORD}
      ASSET_DIR: /data/uploads
    volumes: [cg_uploads:/data/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Front this with a TLS-terminating reverse proxy in production.
    ports: ["127.0.0.1:8080:8080"]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      API_URL: http://api:8080
      HOSTNAME: 0.0.0.0
    depends_on: [api]
    ports: ["127.0.0.1:3000:3000"]

volumes:
  cg_pg:
  cg_redis:
  cg_uploads:
